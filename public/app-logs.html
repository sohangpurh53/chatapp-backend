<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Logs Viewer - Dev Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .log-entry { animation: slideIn 0.2s ease-out; }
        .code-font { font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace; }
        
        /* Light theme variables */
        body.light-theme {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f1f5f9;
            --border-color: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #94a3b8;
        }
        
        /* Dark theme variables */
        body.dark-theme {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #020617;
            --border-color: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-tertiary: #64748b;
        }
    </style>
</head>
<body class="dark-theme transition-colors duration-300 min-h-screen" style="background-color: var(--bg-primary); color: var(--text-primary);">
    <!-- Header with dark theme -->
    <div class="border-b sticky top-0 z-10 shadow-lg transition-colors duration-300" style="background-color: var(--bg-secondary); border-color: var(--border-color);">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center">
                        <i class="fas fa-search text-white text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold" style="color: var(--text-primary);">App Logs</h1>
                        <p class="text-xs code-font" style="color: var(--text-tertiary);" id="apiUrl">Loading...</p>
                    </div>
                </div>
                
                <div class="flex gap-2">
                    <button id="themeToggle" class="px-4 py-2 rounded-lg transition flex items-center gap-2 text-sm hover:opacity-80" style="background-color: var(--bg-tertiary);">
                        <i class="fas fa-moon" id="themeIcon"></i>
                    </button>
                    <button id="clearBtn" class="px-4 py-2 rounded-lg transition flex items-center gap-2 text-sm hover:opacity-80" style="background-color: var(--bg-tertiary);">
                        <i class="fas fa-trash"></i> Clear
                    </button>
                    <button id="refreshBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition flex items-center gap-2 text-sm font-medium text-white">
                        <i class="fas fa-sync-alt" id="refreshIcon"></i> Refresh
                    </button>
                </div>
            </div>

            <!-- Filter Bar -->
            <div class="flex flex-wrap items-center gap-4">
                <div class="flex items-center gap-3">
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="radio" name="logLevel" id="filterAll" class="w-4 h-4 accent-slate-500" checked>
                        <span class="text-sm px-2 py-1 rounded bg-slate-500/20 group-hover:bg-slate-500/30 transition code-font" style="color: var(--text-secondary);">ALL</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="radio" name="logLevel" id="filterLog" class="w-4 h-4 accent-blue-500">
                        <span class="text-sm px-2 py-1 rounded bg-blue-500/20 text-blue-300 group-hover:bg-blue-500/30 transition code-font">LOG</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="radio" name="logLevel" id="filterWarn" class="w-4 h-4 accent-yellow-500">
                        <span class="text-sm px-2 py-1 rounded bg-yellow-500/20 text-yellow-300 group-hover:bg-yellow-500/30 transition code-font">WARN</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="radio" name="logLevel" id="filterError" class="w-4 h-4 accent-red-500">
                        <span class="text-sm px-2 py-1 rounded bg-red-500/20 text-red-300 group-hover:bg-red-500/30 transition code-font">ERROR</span>
                    </label>
                </div>

                <div class="h-6 w-px" style="background-color: var(--border-color);"></div>

                <input type="text" id="searchInput" placeholder="Search logs..." 
                    class="px-3 py-1 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors duration-300" style="background-color: var(--bg-tertiary); border-color: var(--border-color); color: var(--text-primary);">

                <div class="ml-auto flex items-center gap-4 text-sm">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
                        <span style="color: var(--text-tertiary);">Live</span>
                    </div>
                    <span style="color: var(--text-tertiary);">Total: <span id="totalCount" class="font-semibold" style="color: var(--text-primary);">0</span></span>
                </div>
            </div>
        </div>
    </div>

    <div class="container mx-auto px-6 py-6">
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="border rounded-lg p-4 transition-colors duration-300" style="background-color: var(--bg-secondary); border-color: var(--border-color);">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-500/20 rounded-lg flex items-center justify-center">
                        <i class="fas fa-file-alt text-blue-400 text-xl"></i>
                    </div>
                    <div>
                        <div class="text-xs" style="color: var(--text-tertiary);">Info Logs</div>
                        <div class="text-2xl font-bold" id="logCount" style="color: var(--text-primary);">0</div>
                    </div>
                </div>
            </div>
            <div class="border rounded-lg p-4 transition-colors duration-300" style="background-color: var(--bg-secondary); border-color: var(--border-color);">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-yellow-500/20 rounded-lg flex items-center justify-center">
                        <i class="fas fa-exclamation-triangle text-yellow-400 text-xl"></i>
                    </div>
                    <div>
                        <div class="text-xs" style="color: var(--text-tertiary);">Warnings</div>
                        <div class="text-2xl font-bold" id="warnCount" style="color: var(--text-primary);">0</div>
                    </div>
                </div>
            </div>
            <div class="border rounded-lg p-4 transition-colors duration-300" style="background-color: var(--bg-secondary); border-color: var(--border-color);">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-red-500/20 rounded-lg flex items-center justify-center">
                        <i class="fas fa-times-circle text-red-400 text-xl"></i>
                    </div>
                    <div>
                        <div class="text-xs" style="color: var(--text-tertiary);">Errors</div>
                        <div class="text-2xl font-bold" id="errorCount" style="color: var(--text-primary);">0</div>
                    </div>
                </div>
            </div>
            <div class="border rounded-lg p-4 transition-colors duration-300" style="background-color: var(--bg-secondary); border-color: var(--border-color);">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-purple-500/20 rounded-lg flex items-center justify-center">
                        <i class="fas fa-mobile-alt text-purple-400 text-xl"></i>
                    </div>
                    <div>
                        <div class="text-xs" style="color: var(--text-tertiary);">Platform</div>
                        <div class="text-lg font-bold" id="platformInfo" style="color: var(--text-primary);">-</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="text-center py-16">
            <div class="inline-block animate-spin rounded-full h-16 w-16 border-4 border-t-blue-500" style="border-color: var(--border-color); border-top-color: #3b82f6;"></div>
            <p class="mt-4" style="color: var(--text-tertiary);">Fetching logs...</p>
        </div>

        <!-- Error State -->
        <div id="error" class="hidden bg-red-900/20 border border-red-800 rounded-lg p-6 mb-6 transition-colors duration-300">
            <div class="flex items-start gap-3">
                <i class="fas fa-exclamation-circle text-red-400 text-2xl"></i>
                <div>
                    <h3 class="text-red-400 font-semibold mb-1">Failed to Load Logs</h3>
                    <p class="text-red-300 text-sm code-font" id="errorMessage"></p>
                    <button onclick="fetchLogs()" class="mt-3 px-4 py-2 bg-red-800 hover:bg-red-700 rounded-lg text-sm transition text-white">
                        Try Again
                    </button>
                </div>
            </div>
        </div>

        <!-- Logs Container -->
        <div id="logsContainer" class="space-y-2 hidden"></div>

        <!-- Pagination -->
        <div id="pagination" class="hidden mt-6 flex items-center justify-between border-t pt-6 transition-colors duration-300" style="border-color: var(--border-color);">
            <div class="flex items-center gap-2">
                <label for="itemsPerPage" class="text-sm" style="color: var(--text-secondary);">Items per page:</label>
                <select id="itemsPerPage" class="px-3 py-1 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors duration-300" style="background-color: var(--bg-tertiary); border-color: var(--border-color); color: var(--text-primary);">
                    <option value="10">10</option>
                    <option value="25" selected>25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
                <span class="text-sm ml-4" style="color: var(--text-tertiary);">
                    Showing <span id="showingStart" class="font-semibold" style="color: var(--text-primary);">0</span> - 
                    <span id="showingEnd" class="font-semibold" style="color: var(--text-primary);">0</span> of 
                    <span id="showingTotal" class="font-semibold" style="color: var(--text-primary);">0</span>
                </span>
            </div>
            
            <div class="flex items-center gap-2">
                <button id="firstPage" class="px-3 py-2 rounded-lg transition hover:opacity-80 disabled:opacity-40 disabled:cursor-not-allowed" style="background-color: var(--bg-tertiary);">
                    <i class="fas fa-angle-double-left"></i>
                </button>
                <button id="prevPage" class="px-3 py-2 rounded-lg transition hover:opacity-80 disabled:opacity-40 disabled:cursor-not-allowed" style="background-color: var(--bg-tertiary);">
                    <i class="fas fa-angle-left"></i>
                </button>
                
                <div class="flex items-center gap-1" id="pageNumbers"></div>
                
                <button id="nextPage" class="px-3 py-2 rounded-lg transition hover:opacity-80 disabled:opacity-40 disabled:cursor-not-allowed" style="background-color: var(--bg-tertiary);">
                    <i class="fas fa-angle-right"></i>
                </button>
                <button id="lastPage" class="px-3 py-2 rounded-lg transition hover:opacity-80 disabled:opacity-40 disabled:cursor-not-allowed" style="background-color: var(--bg-tertiary);">
                    <i class="fas fa-angle-double-right"></i>
                </button>
            </div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16">
            <i class="fas fa-inbox text-6xl mb-4" style="color: var(--text-tertiary);"></i>
            <p class="text-lg" style="color: var(--text-tertiary);">No logs found</p>
            <p class="text-sm mt-2" style="color: var(--text-tertiary);">Try adjusting your filters</p>
        </div>
    </div>

    <script>
        function getBaseURL(fullUrl) {
            const urlObj = new URL(fullUrl);
            return `${urlObj.protocol}//${urlObj.host}`;
        }
        const url = window.location.href
        const BASE_URL = 'https://socket-chatapp.wesolves.site' || getBaseURL(url);
        const API_ENDPOINT = `${BASE_URL}/api/app-logs`;
        
        let allLogs = [];
        let filteredLogs = [];
        let currentPage = 1;
        let itemsPerPage = 25;

        document.getElementById('apiUrl').textContent = API_ENDPOINT;

        const levelConfig = {
            log: { 
                bg: 'bg-blue-900/40 border-blue-700/50 hover:border-blue-600', 
                badge: 'bg-blue-500/30 text-blue-300',
                icon: 'fas fa-file-alt',
                color: 'text-blue-400',
                name: 'LOG'
            },
            warn: { 
                bg: 'bg-yellow-900/40 border-yellow-700/50 hover:border-yellow-600', 
                badge: 'bg-yellow-500/30 text-yellow-300',
                icon: 'fas fa-exclamation-triangle',
                color: 'text-yellow-400',
                name: 'WARN'
            },
            error: { 
                bg: 'bg-red-900/40 border-red-700/50 hover:border-red-600', 
                badge: 'bg-red-500/30 text-red-300',
                icon: 'fas fa-times-circle',
                color: 'text-red-400',
                name: 'ERROR'
            },
            info: { 
                bg: 'bg-green-900/40 border-green-700/50 hover:border-green-600', 
                badge: 'bg-green-500/30 text-green-300',
                icon: 'fas fa-info-circle',
                color: 'text-green-400',
                name: 'INFO'
            }
        };

        async function fetchLogs() {
            let queryString = '';
            
            if (document.getElementById('filterLog').checked) {
                queryString = '?console.log=true';
            } else if (document.getElementById('filterWarn').checked) {
                queryString = '?console.warn=true';
            } else if (document.getElementById('filterError').checked) {
                queryString = '?console.error=true';
            }
            
            const url = API_ENDPOINT + queryString;

            try {
                showLoading();
                const refreshIcon = document.getElementById('refreshIcon');
                refreshIcon.classList.add('fa-spin');
                
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                allLogs = await response.json();
                applyFilters();
                updateStats(allLogs);
                
                refreshIcon.classList.remove('fa-spin');
            } catch (err) {
                showError(err.message);
                document.getElementById('refreshIcon').classList.remove('fa-spin');
            }
        }

        function showLoading() {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('logsContainer').classList.add('hidden');
            document.getElementById('error').classList.add('hidden');
            document.getElementById('emptyState').classList.add('hidden');
        }

        function showError(message) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('errorMessage').textContent = message;
        }

        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            filteredLogs = allLogs.filter(log => {
                if (searchTerm && !log.message.toLowerCase().includes(searchTerm)) {
                    return false;
                }
                return true;
            });

            currentPage = 1; // Reset to first page when filters change
            displayLogs(filteredLogs);
        }

        function displayLogs(logs) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.add('hidden');
            
            const container = document.getElementById('logsContainer');
            const paginationDiv = document.getElementById('pagination');
            
            if (logs.length === 0) {
                container.classList.add('hidden');
                paginationDiv.classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden');
                return;
            }

            container.classList.remove('hidden');
            paginationDiv.classList.remove('hidden');
            document.getElementById('emptyState').classList.add('hidden');
            
            // Get current items per page value
            const currentItemsPerPage = parseInt(document.getElementById('itemsPerPage').value) || itemsPerPage;
            
            // Calculate pagination
            const totalPages = Math.ceil(logs.length / currentItemsPerPage);
            
            // Ensure current page is within bounds
            if (currentPage > totalPages) {
                currentPage = totalPages || 1;
            }
            
            const startIndex = (currentPage - 1) * currentItemsPerPage;
            const endIndex = Math.min(startIndex + currentItemsPerPage, logs.length);
            const paginatedLogs = logs.slice(startIndex, endIndex);
            
            // Display logs
            container.innerHTML = paginatedLogs.map(log => createLogCard(log)).join('');
            
            // Update pagination UI
            updatePaginationUI(logs.length, totalPages, currentItemsPerPage);
        }

        function updatePaginationUI(totalItems, totalPages, currentItemsPerPage) {
            const startIndex = (currentPage - 1) * currentItemsPerPage;
            const endIndex = Math.min(startIndex + currentItemsPerPage, totalItems);
            
            document.getElementById('showingStart').textContent = totalItems > 0 ? startIndex + 1 : 0;
            document.getElementById('showingEnd').textContent = endIndex;
            document.getElementById('showingTotal').textContent = totalItems;
            
            // Update buttons state
            document.getElementById('firstPage').disabled = currentPage === 1;
            document.getElementById('prevPage').disabled = currentPage === 1;
            document.getElementById('nextPage').disabled = currentPage === totalPages;
            document.getElementById('lastPage').disabled = currentPage === totalPages;
            
            // Generate page numbers
            const pageNumbersDiv = document.getElementById('pageNumbers');
            pageNumbersDiv.innerHTML = '';
            
            const maxVisiblePages = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
            let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);
            
            if (endPage - startPage < maxVisiblePages - 1) {
                startPage = Math.max(1, endPage - maxVisiblePages + 1);
            }
            
            for (let i = startPage; i <= endPage; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.textContent = i;
                pageBtn.className = `px-3 py-2 rounded-lg transition hover:opacity-80 text-sm ${i === currentPage ? 'bg-blue-600 text-white' : ''}`;
                if (i !== currentPage) {
                    pageBtn.style.backgroundColor = 'var(--bg-tertiary)';
                }
                pageBtn.addEventListener('click', () => {
                    currentPage = i;
                    displayLogs(filteredLogs);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
                pageNumbersDiv.appendChild(pageBtn);
            }
        }

        function createLogCard(log) {
            const date = new Date(log.created_at);
            const time = date.toLocaleTimeString();
            const dateStr = date.toLocaleDateString();
            const config = levelConfig[log.level] || levelConfig.info;
            
            return `
                <div class="log-entry border ${config.bg} rounded-lg p-4 transition-all duration-200">
                    <div class="flex items-start gap-4">
                        <div class="flex-shrink-0">
                            <i class="${config.icon} ${config.color} text-2xl"></i>
                        </div>
                        
                        <div class="flex-1 min-w-0">
                            <div class="flex items-start justify-between gap-4 mb-2">
                                <div class="flex items-center gap-2 flex-wrap">
                                    <span class="px-2 py-0.5 rounded text-xs font-semibold ${config.badge} code-font">${config.name}</span>
                                    ${log.platform ? `<span class="px-2 py-0.5 rounded text-xs bg-slate-700 text-slate-300 code-font">${log.platform}</span>` : ''}
                                    ${log.source ? `<span class="px-2 py-0.5 rounded text-xs bg-slate-700 text-slate-300 code-font">${log.source}</span>` : ''}
                                </div>
                                <div class="text-xs text-slate-400 code-font flex-shrink-0">
                                    <div>${time}</div>
                                    <div class="text-slate-500">${dateStr}</div>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <p class="text-slate-100 code-font text-sm leading-relaxed">${escapeHtml(log.message || 'No message')}</p>
                            </div>
                            
                            ${log.payload && log.payload.length > 0 ? `
                                <details class="group">
                                    <summary class="cursor-pointer text-xs text-blue-400 hover:text-blue-300 font-medium inline-flex items-center gap-1">
                                        <i class="fas fa-chevron-right group-open:rotate-90 transition-transform text-xs"></i>
                                        Payload (${log.payload.length} items)
                                    </summary>
                                    <pre class="mt-2 p-3 bg-slate-950 border border-slate-700 rounded text-xs overflow-x-auto code-font text-slate-300">${JSON.stringify(log.payload, null, 2)}</pre>
                                </details>
                            ` : ''}
                            
                            <div class="flex items-center gap-3 mt-3 text-xs text-slate-500 code-font">
                                <span>ID: <span class="text-slate-400">${log.id}</span></span>
                                ${log.app_version ? `<span>v${log.app_version}</span>` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateStats(logs) {
            document.getElementById('totalCount').textContent = logs.length;
            
            const counts = { log: 0, warn: 0, error: 0 };
            logs.forEach(l => counts[l.level] = (counts[l.level] || 0) + 1);
            
            document.getElementById('logCount').textContent = counts.log || 0;
            document.getElementById('warnCount').textContent = counts.warn || 0;
            document.getElementById('errorCount').textContent = counts.error || 0;
            
            const platforms = [...new Set(logs.map(l => l.platform).filter(Boolean))];
            document.getElementById('platformInfo').textContent = platforms.join(', ') || 'N/A';
        }

        // Event listeners
        document.getElementById('refreshBtn').addEventListener('click', fetchLogs);
        document.getElementById('clearBtn').addEventListener('click', () => {
            allLogs = [];
            displayLogs([]);
            updateStats([]);
        });
        document.getElementById('filterAll').addEventListener('change', fetchLogs);
        document.getElementById('filterLog').addEventListener('change', fetchLogs);
        document.getElementById('filterWarn').addEventListener('change', fetchLogs);
        document.getElementById('filterError').addEventListener('change', fetchLogs);
        document.getElementById('searchInput').addEventListener('input', applyFilters);

        // Pagination event listeners
        document.getElementById('itemsPerPage').addEventListener('change', (e) => {
            itemsPerPage = parseInt(e.target.value);
            currentPage = 1;
            displayLogs(filteredLogs);
        });

        document.getElementById('firstPage').addEventListener('click', () => {
            currentPage = 1;
            displayLogs(filteredLogs);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        document.getElementById('prevPage').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                displayLogs(filteredLogs);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

        document.getElementById('nextPage').addEventListener('click', () => {
            const currentItemsPerPage = parseInt(document.getElementById('itemsPerPage').value) || itemsPerPage;
            const totalPages = Math.ceil(filteredLogs.length / currentItemsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                displayLogs(filteredLogs);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

        document.getElementById('lastPage').addEventListener('click', () => {
            const currentItemsPerPage = parseInt(document.getElementById('itemsPerPage').value) || itemsPerPage;
            const totalPages = Math.ceil(filteredLogs.length / currentItemsPerPage);
            currentPage = totalPages;
            displayLogs(filteredLogs);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Auto-refresh every 30 seconds
        {% comment %} setInterval(fetchLogs, 30000); {% endcomment %}

        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');

        function setTheme(theme) {
            document.body.classList.remove('light-theme', 'dark-theme');
            document.body.classList.add(theme);

            if (theme === 'dark-theme') {
                themeIcon.className = 'fas fa-moon';
            } else {
                themeIcon.className = 'fas fa-sun';
            }

            localStorage.setItem('theme', theme);
        }

        // Toggle on click
        themeToggle.addEventListener('click', () => {
            const isDark = document.body.classList.contains('dark-theme');
            setTheme(isDark ? 'light-theme' : 'dark-theme');
        });

        // Load saved theme
        const savedTheme = localStorage.getItem('theme') || 'dark-theme';
        setTheme(savedTheme);

        // Initial load
        fetchLogs();
    </script>
</body>
</html>
